# Thin repo-local Codex configuration.
default_permissions = "project-edit"

[permissions.project-edit]
description = "Edit the current project, with network access."
extends = ":workspace"

[permissions.project-edit.filesystem]
glob_scan_max_depth = 5

[permissions.project-edit.filesystem.":workspace_roots"]
".env" = "deny"
"**/.env" = "deny"
"**/.env.local" = "deny"
"**/.env.production" = "deny"
"**/.env.staging" = "deny"
"**/credentials.json" = "deny"
"**/service-account.json" = "deny"

# ./ae-sdlc work and status reach their MCP servers from inside the sandbox.
[permissions.project-edit.network]
enabled = true

[permissions.project-edit-net]
description = "Project edit plus network access."
extends = ":workspace"

[permissions.project-edit-net.network]
enabled = true
